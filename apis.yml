name: Plerk
description: >-
  Plerk was a Mexican fintech startup offering an employee-benefits and perks
  platform ("beneficios para colaboradores") for companies in Mexico, backed by
  500 Global. During 2023 Plerk merged with minu to consolidate the employee
  benefits offering in Mexico, and the standalone Plerk product was wound down.
  Its primary domain plerk.com no longer resolves (DNS fully lapsed; last web
  archive May 2023) and plerk.io redirects to the now-defunct plerk.com. Support
  was handled at soporte@plerk.io. This profile is retained as a defunct/acquired
  lead; the surviving product and any API surface live under minu. No live
  developer portal, API, SDK, or documentation surface exists for Plerk.
